      - name: Descargar Vencord completo
        run: |
          mkdir -p app/src/main/assets
          curl -L --fail -o app/src/main/assets/browser.js https://github.com/Vendicated/Vencord/releases/download/devbuild/browser.js
          curl -L --fail -o app/src/main/assets/browser.css https://github.com/Vendicated/Vencord/releases/download/devbuild/browser.css || echo "sin browser.css"
      - name: Parchear Vencord (ajustes y nombre BlackCord)
        run: python3 patch_vencord.py
      - name: Compilar APK
        run: gradle assembleRelease --no-daemon
      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: BlackCord-apk
          path: app/build/outputs/apk/release/*.apk
      - name: Publicar release con enlace directo
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: BlackCord ${{ github.run_number }}
          files: app/build/outputs/apk/release/*.apk
          
