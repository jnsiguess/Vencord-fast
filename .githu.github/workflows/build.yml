name: Build APK
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
      - name: Descargar Vencord completo
        run: |
          mkdir -p app/src/main/assets
          curl -L --fail -o app/src/main/assets/browser.js https://github.com/Vendicated/Vencord/releases/download/devbuild/browser.js
          ls -la app/src/main/assets/browser.js
      - name: Crear settings.gradle.kts
        run: |
          :
          cat > "settings.gradle.kts" <<'EOF_VMF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "VencordMobileFast"
          include(":app")
          EOF_VMF
      - name: Crear build.gradle.kts
        run: |
          :
          cat > "build.gradle.kts" <<'EOF_VMF'
          plugins {
              id("com.android.application") version "8.5.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.24" apply false
          }
          EOF_VMF
      - name: Crear gradle.properties
        run: |
          :
          cat > "gradle.properties" <<'EOF_VMF'
          org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
          android.useAndroidX=true
          kotlin.code.style=official
          EOF_VMF
      - name: Crear app/build.gradle.kts
        run: |
          mkdir -p "app"
          cat > "app/build.gradle.kts" <<'EOF_VMF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "dev.vencordmobile.fast"
              compileSdk = 34

              defaultConfig {
                  applicationId = "dev.vencordmobile.fast"
                  minSdk = 24
                  targetSdk = 34
                  versionCode = 1
                  versionName = "1.0"
              }

              buildTypes {
                  release {
                      isMinifyEnabled = false
                      // firma con la clave de debug para que el APK release se pueda instalar directamente
                      signingConfig = signingConfigs.getByName("debug")
                  }
              }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = "17" }
          }

          dependencies {
              implementation("androidx.webkit:webkit:1.11.0")
          }
          EOF_VMF
      - name: Crear app/src/main/AndroidManifest.xml
        run: |
          mkdir -p "app/src/main"
          cat > "app/src/main/AndroidManifest.xml" <<'EOF_VMF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.RECORD_AUDIO" />
              <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />

              <application
                  android:label="Vencord Fast"
                  android:hardwareAccelerated="true"
                  android:usesCleartextTraffic="false"
                  android:theme="@android:style/Theme.DeviceDefault.NoActionBar">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:hardwareAccelerated="true"
                      android:windowSoftInputMode="adjustResize"
                      android:configChanges="orientation|screenSize|smallestScreenSize|screenLayout|keyboardHidden|keyboard|uiMode">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF_VMF
      - name: Crear app/src/main/java/dev/vencordmobile/fast/MainActivity.kt
        run: |
          mkdir -p "app/src/main/java/dev/vencordmobile/fast"
          cat > "app/src/main/java/dev/vencordmobile/fast/MainActivity.kt" <<'EOF_VMF'
          package dev.vencordmobile.fast

          import android.Manifest
          import android.annotation.SuppressLint
          import android.app.Activity
          import android.content.Intent
          import android.content.pm.PackageManager
          import android.graphics.Color
          import android.net.Uri
          import android.os.Bundle
          import android.view.View
          import android.view.ViewGroup
          import android.webkit.CookieManager
          import android.webkit.PermissionRequest
          import android.webkit.ValueCallback
          import android.webkit.WebChromeClient
          import android.webkit.WebResourceRequest
          import android.webkit.WebSettings
          import android.webkit.WebView
          import android.webkit.WebViewClient
          import androidx.webkit.WebViewCompat
          import androidx.webkit.WebViewFeature

          class MainActivity : Activity() {

              private lateinit var web: WebView
              private var fileCallback: ValueCallback<Array<Uri>>? = null
              private var pendingPermission: PermissionRequest? = null
              private var injectedAtStart = false
              private lateinit var payload: String

              companion object {
                  const val HOME = "https://discord.com/app"
                  const val REQ_FILE = 1001
                  const val REQ_MIC = 1002
                  // dominios que se quedan dentro de la app (el resto se abre en el navegador)
                  val INTERNAL = listOf("discord.com", "discordapp.com", "discord.media", "hcaptcha.com", "gstatic.com", "google.com")
              }

              @SuppressLint("SetJavaScriptEnabled")
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  window.statusBarColor = Color.parseColor("#1e1f22")
                  window.navigationBarColor = Color.parseColor("#1e1f22")

                  web = WebView(this)
                  web.setBackgroundColor(Color.parseColor("#313338"))
                  web.setLayerType(View.LAYER_TYPE_HARDWARE, null)
                  setContentView(
                      web,
                      ViewGroup.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.MATCH_PARENT)
                  )

                  val s = web.settings
                  s.javaScriptEnabled = true
                  s.domStorageEnabled = true
                  s.mediaPlaybackRequiresUserGesture = false
                  s.cacheMode = WebSettings.LOAD_DEFAULT
                  s.setSupportZoom(false)
                  s.builtInZoomControls = false
                  s.displayZoomControls = false
                  s.useWideViewPort = true
                  s.textZoom = 100
                  s.allowFileAccess = false
                  s.offscreenPreRaster = true

                  CookieManager.getInstance().apply {
                      setAcceptCookie(true)
                      setAcceptThirdPartyCookies(web, true)
                  }

                  // capa táctil + Vencord completo
                  payload = readAsset("mobile_layer.js") + "\n;\n" + readAsset("browser.js")

                  if (WebViewFeature.isFeatureSupported(WebViewFeature.DOCUMENT_START_SCRIPT)) {
                      WebViewCompat.addDocumentStartJavaScript(web, payload, setOf("https://discord.com"))
                      injectedAtStart = true
                  }

                  web.webViewClient = object : WebViewClient() {
                      override fun onPageStarted(view: WebView, url: String?, favicon: android.graphics.Bitmap?) {
                          // respaldo para WebViews antiguos sin soporte de script al inicio
                          if (!injectedAtStart && url?.contains("discord.com") == true) {
                              view.evaluateJavascript(payload, null)
                          }
                      }

                      override fun shouldOverrideUrlLoading(view: WebView, request: WebResourceRequest): Boolean {
                          if (!request.isForMainFrame) return false
                          val host = request.url.host ?: return false
                          if (INTERNAL.any { host == it || host.endsWith(".$it") }) return false
                          return try {
                              startActivity(Intent(Intent.ACTION_VIEW, request.url))
                              true
                          } catch (e: Exception) {
                              false
                          }
                      }
                  }

                  web.webChromeClient = object : WebChromeClient() {
                      override fun onShowFileChooser(
                          webView: WebView,
                          callback: ValueCallback<Array<Uri>>,
                          params: FileChooserParams
                      ): Boolean {
                          fileCallback?.onReceiveValue(null)
                          fileCallback = callback
                          return try {
                              startActivityForResult(params.createIntent(), REQ_FILE)
                              true
                          } catch (e: Exception) {
                              fileCallback = null
                              false
                          }
                      }

                      override fun onPermissionRequest(request: PermissionRequest) {
                          runOnUiThread {
                              val wantsMic = request.resources.contains(PermissionRequest.RESOURCE_AUDIO_CAPTURE)
                              if (wantsMic && checkSelfPermission(Manifest.permission.RECORD_AUDIO) != PackageManager.PERMISSION_GRANTED) {
                                  pendingPermission = request
                                  requestPermissions(arrayOf(Manifest.permission.RECORD_AUDIO), REQ_MIC)
                              } else {
                                  request.grant(request.resources)
                              }
                          }
                      }
                  }

                  if (savedInstanceState == null) web.loadUrl(HOME) else web.restoreState(savedInstanceState)
              }

              private fun readAsset(name: String): String =
                  assets.open(name).bufferedReader().use { it.readText() }

              @Deprecated("Deprecated in Java")
              override fun onActivityResult(requestCode: Int, resultCode: Int, data: Intent?) {
                  if (requestCode == REQ_FILE) {
                      fileCallback?.onReceiveValue(WebChromeClient.FileChooserParams.parseResult(resultCode, data))
                      fileCallback = null
                  } else {
                      @Suppress("DEPRECATION")
                      super.onActivityResult(requestCode, resultCode, data)
                  }
              }

              override fun onRequestPermissionsResult(requestCode: Int, permissions: Array<out String>, grantResults: IntArray) {
                  super.onRequestPermissionsResult(requestCode, permissions, grantResults)
                  if (requestCode == REQ_MIC) {
                      val req = pendingPermission
                      pendingPermission = null
                      if (grantResults.firstOrNull() == PackageManager.PERMISSION_GRANTED) req?.grant(req.resources) else req?.deny()
                  }
              }

              @Deprecated("Deprecated in Java")
              override fun onBackPressed() {
                  if (web.canGoBack()) web.goBack() else {
                      @Suppress("DEPRECATION")
                      super.onBackPressed()
                  }
              }

              override fun onSaveInstanceState(outState: Bundle) {
                  super.onSaveInstanceState(outState)
                  web.saveState(outState)
              }

              override fun onPause() { web.onPause(); super.onPause() }
              override fun onResume() { super.onResume(); web.onResume() }
              override fun onDestroy() { web.destroy(); super.onDestroy() }
          }
          EOF_VMF
      - name: Crear app/src/main/assets/mobile_layer.js
        run: |
          mkdir -p "app/src/main/assets"
          cat > "app/src/main/assets/mobile_layer.js" <<'EOF_VMF'
          // Capa táctil y de rendimiento (se ejecuta antes que Vencord y que la página)
          (() => {
              "use strict";
              const OPT = { touchFix: true, pressFeedback: true, lite: true, passiveTouch: true };

              const css = [];
              if (OPT.touchFix) css.push(`
                  html, body, a, button, input, textarea, select, summary,
                  [role="button"], [role="tab"], [role="menuitem"], [role="option"], [role="switch"],
                  [class*="clickable"], [class*="interactive"], [class*="button"] { touch-action: manipulation !important; }
                  * { -webkit-tap-highlight-color: transparent; }
                  html { overscroll-behavior: none; }`);
              if (OPT.pressFeedback) css.push(`
                  button:active, [role="button"]:active, [role="tab"]:active,
                  [role="menuitem"]:active, [class*="clickable"]:active { opacity: .72; transition: none !important; }`);
              if (OPT.lite) css.push(`
                  * { transition-duration: .01s !important; transition-delay: 0s !important; scroll-behavior: auto !important; }
                  *, *::before, *::after { backdrop-filter: none !important; -webkit-backdrop-filter: none !important; }`);

              const root = () => document.head || document.documentElement;

              const apply = () => {
                  const r = root();
                  if (!r) return;
                  if (OPT.touchFix) {
                      let m = document.querySelector('meta[name="viewport"]');
                      if (!m) { m = document.createElement("meta"); m.name = "viewport"; r.appendChild(m); }
                      m.content = "width=device-width, initial-scale=1, viewport-fit=cover";
                  }
                  if (css.length && !document.getElementById("vmf-style")) {
                      const s = document.createElement("style");
                      s.id = "vmf-style";
                      s.textContent = css.join("\n");
                      r.appendChild(s);
                  }
              };

              if (OPT.passiveTouch) {
                  try {
                      const proto = EventTarget.prototype, orig = proto.addEventListener;
                      const types = new Set(["touchstart", "touchmove", "wheel", "mousewheel"]);
                      proto.addEventListener = function (type, fn, opts) {
                          if (types.has(type)) {
                              if (opts == null || typeof opts === "boolean") opts = { capture: !!opts, passive: true };
                              else if (typeof opts === "object" && opts.passive === undefined) opts = { ...opts, passive: true };
                          }
                          return orig.call(this, type, fn, opts);
                      };
                  } catch (e) { console.warn("[VencordFast] passive patch omitido", e); }
              }

              apply();
              document.addEventListener("DOMContentLoaded", apply);
              new MutationObserver(apply).observe(document, { childList: true, subtree: false });
          })();
          EOF_VMF
      - name: Compilar APK
        run: gradle assembleRelease --no-daemon
      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: VencordFast-apk
          path: app/build/outputs/apk/release/*.apk
      - name: Publicar release con enlace directo
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: Vencord Fast ${{ github.run_number }}
          files: app/build/outputs/apk/release/*.apk
          
