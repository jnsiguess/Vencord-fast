name: Build BlackCord APK
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
      - name: Descargar Vencord completo
        run: |
          mkdir -p app/src/main/assets
          curl -L --fail -o app/src/main/assets/browser.js https://github.com/Vendicated/Vencord/releases/download/devbuild/browser.js
          curl -L --fail -o app/src/main/assets/browser.css https://github.com/Vendicated/Vencord/releases/download/devbuild/browser.css || echo "sin browser.css"
          ls -la app/src/main/assets
      - name: Crear settings.gradle.kts
        run: |
          cat > "settings.gradle.kts" <<'EOF_VMF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "BlackCord"
          include(":app")
          EOF_VMF
      - name: Crear build.gradle.kts
        run: |
          cat > "build.gradle.kts" <<'EOF_VMF'
          plugins {
              id("com.android.application") version "8.5.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.24" apply false
          }
          EOF_VMF
      - name: Crear gradle.properties
        run: |
          cat > "gradle.properties" <<'EOF_VMF'
          org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
          android.useAndroidX=true
          kotlin.code.style=official
          EOF_VMF
      - name: Crear app/build.gradle.kts
        run: |
          mkdir -p "app"
          cat > "app/build.gradle.kts" <<'EOF_VMF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "dev.blackcord.app"
              compileSdk = 34

              defaultConfig {
                  applicationId = "dev.blackcord.app"
                  minSdk = 24
                  targetSdk = 34
                  versionCode = 1
                  versionName = "1.0"
              }

              buildTypes {
                  release {
                      isMinifyEnabled = false
                      // firma con la clave de debug para que el APK release se pueda instalar directamente
                      signingConfig = signingConfigs.getByName("debug")
                  }
              }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = "17" }
          }

          dependencies {
              implementation("androidx.webkit:webkit:1.11.0")
          }
          EOF_VMF
      - name: Crear app/src/main/AndroidManifest.xml
        run: |
          mkdir -p "app/src/main"
          cat > "app/src/main/AndroidManifest.xml" <<'EOF_VMF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.RECORD_AUDIO" />
              <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />

              <application
                  android:label="BlackCord"
                  android:icon="@mipmap/ic_launcher"
                  android:hardwareAccelerated="true"
                  android:usesCleartextTraffic="false"
                  android:theme="@android:style/Theme.DeviceDefault.NoActionBar">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:hardwareAccelerated="true"
                      android:windowSoftInputMode="adjustResize"
                      android:configChanges="orientation|screenSize|smallestScreenSize|screenLayout|keyboardHidden|keyboard|uiMode">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF_VMF
      - name: Crear app/src/main/java/dev/blackcord/app/MainActivity.kt
        run: |
          mkdir -p "app/src/main/java/dev/blackcord/app"
          cat > "app/src/main/java/dev/blackcord/app/MainActivity.kt" <<'EOF_VMF'
          package dev.blackcord.app

          import android.Manifest
          import android.annotation.SuppressLint
          import android.app.Activity
          import android.content.Intent
          import android.content.pm.PackageManager
          import android.graphics.Color
          import android.net.Uri
          import android.os.Bundle
          import android.view.View
          import android.view.ViewGroup
          import android.webkit.CookieManager
          import android.webkit.PermissionRequest
          import android.webkit.ValueCallback
          import android.webkit.WebChromeClient
          import android.webkit.WebResourceRequest
          import android.webkit.WebSettings
          import android.webkit.WebView
          import android.webkit.WebViewClient
          import androidx.webkit.WebViewCompat
          import androidx.webkit.WebViewFeature

          class MainActivity : Activity() {

              private lateinit var web: WebView
              private var fileCallback: ValueCallback<Array<Uri>>? = null
              private var pendingPermission: PermissionRequest? = null
              private var injectedAtStart = false
              private lateinit var payload: String

              companion object {
                  const val HOME = "https://discord.com/app"
                  const val REQ_FILE = 1001
                  const val REQ_MIC = 1002
                  // dominios que se quedan dentro de la app (el resto se abre en el navegador)
                  val INTERNAL = listOf("discord.com", "discordapp.com", "discord.media", "hcaptcha.com", "gstatic.com", "google.com")
              }

              @SuppressLint("SetJavaScriptEnabled")
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  window.statusBarColor = Color.parseColor("#1e1f22")
                  window.navigationBarColor = Color.parseColor("#1e1f22")

                  web = WebView(this)
                  web.setBackgroundColor(Color.parseColor("#313338"))
                  web.setLayerType(View.LAYER_TYPE_HARDWARE, null)
                  setContentView(
                      web,
                      ViewGroup.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.MATCH_PARENT)
                  )

                  val s = web.settings
                  s.javaScriptEnabled = true
                  s.domStorageEnabled = true
                  s.mediaPlaybackRequiresUserGesture = false
                  s.cacheMode = WebSettings.LOAD_DEFAULT
                  s.setSupportZoom(false)
                  s.builtInZoomControls = false
                  s.displayZoomControls = false
                  s.useWideViewPort = true
                  s.textZoom = 100
                  s.allowFileAccess = false
                  s.offscreenPreRaster = true

                  CookieManager.getInstance().apply {
                      setAcceptCookie(true)
                      setAcceptThirdPartyCookies(web, true)
                  }

                  // capa táctil + Vencord completo
                  val vencordCss = try { readAsset("browser.css") } catch (e: Exception) { "" }
                  payload = "window.__VMF_CSS=" + org.json.JSONObject.quote(vencordCss) + ";\n" +
                      readAsset("mobile_layer.js") + "\n;\n" + readAsset("browser.js")

                  if (WebViewFeature.isFeatureSupported(WebViewFeature.DOCUMENT_START_SCRIPT)) {
                      WebViewCompat.addDocumentStartJavaScript(web, payload, setOf("https://discord.com"))
                      injectedAtStart = true
                  }

                  web.webViewClient = object : WebViewClient() {
                      override fun onPageStarted(view: WebView, url: String?, favicon: android.graphics.Bitmap?) {
                          // respaldo para WebViews antiguos sin soporte de script al inicio
                          if (!injectedAtStart && url?.contains("discord.com") == true) {
                              view.evaluateJavascript(payload, null)
                          }
                      }

                      override fun shouldOverrideUrlLoading(view: WebView, request: WebResourceRequest): Boolean {
                          if (!request.isForMainFrame) return false
                          val host = request.url.host ?: return false
                          if (INTERNAL.any { host == it || host.endsWith(".$it") }) return false
                          return try {
                              startActivity(Intent(Intent.ACTION_VIEW, request.url))
                              true
                          } catch (e: Exception) {
                              false
                          }
                      }
                  }

                  web.webChromeClient = object : WebChromeClient() {
                      override fun onShowFileChooser(
                          webView: WebView,
                          callback: ValueCallback<Array<Uri>>,
                          params: FileChooserParams
                      ): Boolean {
                          fileCallback?.onReceiveValue(null)
                          fileCallback = callback
                          return try {
                              startActivityForResult(params.createIntent(), REQ_FILE)
                              true
                          } catch (e: Exception) {
                              fileCallback = null
                              false
                          }
                      }

                      override fun onPermissionRequest(request: PermissionRequest) {
                          runOnUiThread {
                              val wantsMic = request.resources.contains(PermissionRequest.RESOURCE_AUDIO_CAPTURE)
                              if (wantsMic && checkSelfPermission(Manifest.permission.RECORD_AUDIO) != PackageManager.PERMISSION_GRANTED) {
                                  pendingPermission = request
                                  requestPermissions(arrayOf(Manifest.permission.RECORD_AUDIO), REQ_MIC)
                              } else {
                                  request.grant(request.resources)
                              }
                          }
                      }
                  }

                  if (savedInstanceState == null) web.loadUrl(HOME) else web.restoreState(savedInstanceState)
              }

              private fun readAsset(name: String): String =
                  assets.open(name).bufferedReader().use { it.readText() }

              @Deprecated("Deprecated in Java")
              override fun onActivityResult(requestCode: Int, resultCode: Int, data: Intent?) {
                  if (requestCode == REQ_FILE) {
                      fileCallback?.onReceiveValue(WebChromeClient.FileChooserParams.parseResult(resultCode, data))
                      fileCallback = null
                  } else {
                      @Suppress("DEPRECATION")
                      super.onActivityResult(requestCode, resultCode, data)
                  }
              }

              override fun onRequestPermissionsResult(requestCode: Int, permissions: Array<out String>, grantResults: IntArray) {
                  super.onRequestPermissionsResult(requestCode, permissions, grantResults)
                  if (requestCode == REQ_MIC) {
                      val req = pendingPermission
                      pendingPermission = null
                      if (grantResults.firstOrNull() == PackageManager.PERMISSION_GRANTED) req?.grant(req.resources) else req?.deny()
                  }
              }

              @Deprecated("Deprecated in Java")
              override fun onBackPressed() {
                  if (web.canGoBack()) web.goBack() else {
                      @Suppress("DEPRECATION")
                      super.onBackPressed()
                  }
              }

              override fun onSaveInstanceState(outState: Bundle) {
                  super.onSaveInstanceState(outState)
                  web.saveState(outState)
              }

              override fun onPause() { web.onPause(); super.onPause() }
              override fun onResume() { super.onResume(); web.onResume() }
              override fun onDestroy() { web.destroy(); super.onDestroy() }
          }
          EOF_VMF
      - name: Crear app/src/main/assets/mobile_layer.js
        run: |
          mkdir -p "app/src/main/assets"
          cat > "app/src/main/assets/mobile_layer.js" <<'EOF_VMF'
          // Capa táctil + CSS de BlackCord + botón flotante "B" para abrir los ajustes de BlackCord
          (() => {
              "use strict";
              const OPT = { touchFix: true, pressFeedback: true, lite: true, passiveTouch: true, floatingButton: true };

              const css = [];
              if (OPT.touchFix) css.push(`
                  html, body, a, button, input, textarea, select, summary,
                  [role="button"], [role="tab"], [role="menuitem"], [role="option"], [role="switch"],
                  [class*="clickable"], [class*="interactive"], [class*="button"] { touch-action: manipulation !important; }
                  * { -webkit-tap-highlight-color: transparent; }
                  html { overscroll-behavior: none; }`);
              if (OPT.pressFeedback) css.push(`
                  button:active, [role="button"]:active, [role="tab"]:active,
                  [role="menuitem"]:active, [class*="clickable"]:active { opacity: .72; transition: none !important; }`);
              if (OPT.lite) css.push(`
                  * { transition-duration: .01s !important; transition-delay: 0s !important; scroll-behavior: auto !important; }
                  *, *::before, *::after { backdrop-filter: none !important; -webkit-backdrop-filter: none !important; }`);

              const root = () => document.head || document.documentElement;

              const addStyle = (id, text) => {
                  if (!text || document.getElementById(id)) return;
                  const r = root();
                  if (!r) return;
                  const s = document.createElement("style");
                  s.id = id;
                  s.textContent = text;
                  r.appendChild(s);
              };

              const apply = () => {
                  const r = root();
                  if (!r) return;
                  if (OPT.touchFix) {
                      let m = document.querySelector('meta[name="viewport"]');
                      if (!m) { m = document.createElement("meta"); m.name = "viewport"; r.appendChild(m); }
                      m.content = "width=device-width, initial-scale=1, viewport-fit=cover";
                  }
                  addStyle("vmf-style", css.join("\n"));
                  addStyle("vmf-vencord-css", window.__VMF_CSS); // estilos de Vencord (browser.css)
                  buildUI();
              };

              // ---- botón flotante con acceso a los ajustes de Vencord ----
              function buildUI() {
                  if (!OPT.floatingButton || !document.body || document.getElementById("vmf-fab")) return;

                  addStyle("vmf-ui-style", `
                      #vmf-fab{position:fixed;left:6px;top:42%;width:40px;height:40px;border-radius:50%;
                        background:#5865f2;color:#fff;font:700 18px/40px sans-serif;text-align:center;
                        opacity:.5;z-index:2147483646;user-select:none;touch-action:manipulation}
                      #vmf-panel{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);width:min(86vw,340px);
                        background:#1e1f22;color:#fff;border-radius:14px;padding:14px;z-index:2147483647;
                        font:15px sans-serif;box-shadow:0 8px 30px rgba(0,0,0,.6);display:none}
                      #vmf-panel b{display:block;margin-bottom:4px;font-size:16px}
                      #vmf-msg{font-size:13px;opacity:.85;margin:4px 0 10px;white-space:pre-wrap}
                      #vmf-panel button{display:block;width:100%;margin:6px 0;padding:12px;border:0;border-radius:8px;
                        background:#5865f2;color:#fff;font:600 15px sans-serif;touch-action:manipulation}
                      #vmf-panel button.vmf-x{background:#3b3d44}
                  `);

                  const fab = document.createElement("div");
                  fab.id = "vmf-fab";
                  fab.textContent = "B";

                  const panel = document.createElement("div");
                  panel.id = "vmf-panel";
                  const title = document.createElement("b");
                  title.textContent = "BlackCord";
                  const msg = document.createElement("div");
                  msg.id = "vmf-msg";
                  panel.append(title, msg);

                  const open = (key) => {
                      try {
                          const t = window.Vencord && window.Vencord.__vmf;
                          if (!window.Vencord) throw new Error("BlackCord no se cargó.");
                          if (!t) throw new Error("Esta versión de BlackCord no permite abrir los ajustes desde aquí.");
                          t.open(t[key]);
                          panel.style.display = "none";
                      } catch (e) {
                          msg.textContent = "No se pudo abrir: " + (e && e.message ? e.message : e) +
                              "\nSi acabas de abrir la app, espera unos segundos a que Discord cargue y reintenta.";
                      }
                  };

                  [["Ajustes de BlackCord", "main"], ["Plugins", "plugins"], ["Temas", "themes"],
                   ["Nube", "cloud"], ["Respaldo y restaurar", "backup"]].forEach(([label, key]) => {
                      const b = document.createElement("button");
                      b.textContent = label;
                      b.addEventListener("click", () => open(key));
                      panel.appendChild(b);
                  });
                  const close = document.createElement("button");
                  close.className = "vmf-x";
                  close.textContent = "Cerrar";
                  close.addEventListener("click", () => { panel.style.display = "none"; });
                  panel.appendChild(close);

                  fab.addEventListener("click", () => {
                      const loaded = !!window.Vencord;
                      msg.textContent = loaded
                          ? "BlackCord cargado correctamente. Elige qué abrir:"
                          : "BlackCord NO se ha cargado. Cierra y abre la app; si sigue igual, avísame.";
                      panel.style.display = panel.style.display === "block" ? "none" : "block";
                  });

                  document.body.append(fab, panel);
              }

              if (OPT.passiveTouch) {
                  try {
  
